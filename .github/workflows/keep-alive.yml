# Keeps the Render API awake (its free plan sleeps after 15 idle minutes).
# GitHub runs scheduled jobs at most every 5 minutes, so each run pings three
# times, two minutes apart: together that's a ping about every 2 minutes.
# Free for public repositories. Scheduled runs can start a few minutes late
# when GitHub is busy, and GitHub pauses them after 60 days without a commit
# (re-enable under Actions → Keep Render awake).
name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/keep_alive.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/keep_alive.py --count 3 --interval 120
